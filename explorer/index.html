<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Letters to Networks · classroom lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap" rel="stylesheet">
<style>
  :root{--bg:#f4f5f6;--paper:#fff;--ink:#15181c;--muted:#59636d;--line:#dce2e7;--blue:#2a78d6;--orange:#df6637;font:14px/1.5 "IBM Plex Sans",system-ui,sans-serif;color:var(--ink)}
  *{box-sizing:border-box}body{margin:0;background:var(--bg)}button,input,textarea{font:inherit}button{cursor:pointer}h1,h2,h3,p{margin-top:0}h1,h2{font-family:"Newsreader",Georgia,serif}h1{font-size:clamp(2rem,4vw,2.6rem);line-height:1.05;margin:0}h2{font-size:1.55rem;line-height:1.14;margin-bottom:.4rem}h3{font-size:1.08rem;margin-bottom:.4rem}a{color:#1763ba}.hidden{display:none!important}
  .wrap{max-width:1560px;margin:auto;padding:20px clamp(14px,2vw,28px) 68px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px}.card{background:var(--paper);border:1px solid var(--line);border-radius:10px}.body{padding:18px}.btn{border:1px solid var(--line);border-radius:6px;padding:8px 12px;background:#fff;color:var(--ink);font-weight:600}.btn:hover{background:#eef4fb;border-color:var(--blue)}.btn.primary{background:var(--blue);border-color:var(--blue);color:white}.btn.primary:hover{background:#1765be}.status{font-size:.82rem;color:var(--muted);margin:0}.status.error{color:#b13d25}
  .layout{display:grid;grid-template-columns:240px minmax(0,1fr) minmax(280px,340px);gap:12px;align-items:start}.deck{position:sticky;top:12px}.deck-buttons{display:grid;gap:5px;margin-top:12px}.letter-tab{width:100%;border:1px solid var(--line);border-radius:6px;background:white;text-align:left;padding:8px 10px;display:grid;grid-template-columns:27px 1fr auto;gap:7px;align-items:start;color:var(--ink);font-size:.8rem}.letter-tab:hover,.letter-tab.active{background:#eef4fb;border-color:var(--blue)}.letter-tab span:first-child{font-weight:700;color:#1763ba}.letter-tab small,.letter-tab em{color:var(--muted);font-style:normal}.reading{min-height:520px}.letter-head{display:flex;gap:12px;justify-content:space-between;align-items:start}.letter-head a{white-space:nowrap;font-size:.77rem}.eyebrow{color:#95502c;letter-spacing:.1em;text-transform:uppercase;font-weight:700;font-size:.7rem;margin-bottom:5px}.letter-text{max-height:610px;overflow:auto;border-top:1px solid var(--line);margin-top:15px;padding-top:16px;font:1.11rem/1.6 "Newsreader",Georgia,serif}.letter-text p{margin:0 0 1em}.source-link{margin-top:10px}
  .fields{display:grid;gap:12px}.fields label{display:grid;gap:5px;font-size:.82rem;font-weight:600}.fields input,.fields textarea,.graph-controls input[type=search]{width:100%;border:1px solid var(--line);background:white;border-radius:6px;padding:9px 10px;color:var(--ink)}.fields textarea{min-height:95px;resize:vertical}.annotation-list{display:grid;gap:8px;margin-top:12px}.annotation{padding:10px;border:1px solid var(--line);border-radius:6px;background:#f8fafc;font-size:.82rem}.annotation strong{display:block;color:#9b4928}.annotation p{margin:5px 0 0}.annotation-panel h2{margin-bottom:14px}
  .graph-area{margin-top:18px}.graph-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}.graph-head h2{margin-bottom:3px}.graph-layout{display:grid;grid-template-columns:210px minmax(0,1fr) 290px;gap:12px;margin-top:15px;align-items:start}.graph-controls{display:grid;gap:13px;font-size:.82rem}.graph-controls fieldset{border:0;padding:0;margin:0;display:grid;gap:6px}.graph-controls legend{font-weight:700;color:var(--muted);margin-bottom:5px}.graph-controls label{display:flex;align-items:center;gap:7px}.graph-controls input[type=radio],.graph-controls input[type=checkbox]{accent-color:var(--blue)}.graph-controls input[type=search]{font-size:.82rem}.graph-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.graph-stats b{display:block;font-size:1.2rem;line-height:1.1}.graph-stats small{color:var(--muted);font-size:.72rem}.legend{display:grid;gap:4px;color:var(--muted)}.legend span{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}.stage{position:relative;height:min(70vh,660px);min-height:440px;overflow:hidden}.stage canvas{width:100%;height:100%;display:block;cursor:grab;touch-action:none}.stage canvas.dragging{cursor:grabbing}.tip{position:absolute;pointer-events:none;background:white;border:1px solid var(--line);box-shadow:0 3px 12px #0002;padding:6px 8px;border-radius:5px;font-size:.8rem;max-width:240px}.stage-bar{position:absolute;left:10px;bottom:10px;display:flex;gap:6px}.stage-bar button{padding:5px 8px;font-size:.76rem}.detail{max-height:660px;overflow:auto}.detail .annotation{margin-top:8px}.detail-entry{border-top:1px solid var(--line);padding:9px 0;font-size:.81rem}.detail-entry p{margin:4px 0}.detail small{color:var(--muted)}.graph-foot{margin-top:9px;color:var(--muted);font-size:.78rem}
  @media(max-width:1200px){.layout{grid-template-columns:220px minmax(0,1fr)}.annotation-panel{grid-column:2}.graph-layout{grid-template-columns:180px minmax(0,1fr)}.detail{grid-column:1/-1;max-height:330px}}
  @media(max-width:760px){.layout,.graph-layout{grid-template-columns:1fr}.deck{position:static}.annotation-panel,.detail{grid-column:auto}.stage{height:58vh;min-height:390px}.top{align-items:start}.letter-head{display:block}}
  .graph-controls .find-label{display:grid;gap:5px}.legend .relation-key{display:inline-block;width:15px;height:0;border-top:3px solid #9b38a3;border-radius:0;vertical-align:middle}
  :focus-visible{outline:3px solid #70a7d6;outline-offset:2px}
</style>
<div class="wrap">
  <header class="top"><h1>Letters to Networks</h1><button class="btn" id="skipToGraph">Skip exercise · reveal graph</button></header>
  <p class="status" id="modeStatus" role="status"></p>
  <main class="layout hidden" id="assignmentArea">
    <aside class="card body deck"><h2>Ten letters</h2><p class="status" id="progress">0 / 10 annotated</p><div class="deck-buttons" id="letterDeck"></div></aside>
    <article class="card body reading" id="reader"></article>
    <section class="card body annotation-panel"><h2>Annotate this letter</h2>
      <div class="fields">
        <label>Relation tag<input id="relationTag" type="text" maxlength="60" placeholder="Name the relation in your own words"></label>
        <label>One-sentence explanation<textarea id="relationNote" maxlength="300" placeholder="What in this letter supports that relation?"></textarea></label>
        <button class="btn primary" id="addAnnotation">Add relation</button>
        <p class="status" id="saveStatus" role="status"></p>
      </div>
      <div id="annotationList" class="annotation-list"></div>
    </section>
  </main>
  <section class="card body graph-area hidden" id="graphArea">
    <div class="graph-head"><div><h2>Archive network</h2><p class="status" id="graphStatus"></p></div></div>
    <div class="graph-layout">
      <aside class="card body graph-controls">
        <fieldset><legend>Show</legend><label><input id="showBase" type="checkbox" checked> Archival letters</label><label><input id="showAnnotations" type="checkbox" checked> Annotated relations</label></fieldset>
        <fieldset><legend>Colour by</legend><label><input name="colorBy" type="radio" value="edition" checked> Edition</label><label><input name="colorBy" type="radio" value="community"> Community</label></fieldset>
        <div class="legend" id="graphLegend"></div>
        <fieldset><legend>Size by</legend><label><input name="sizeBy" type="radio" value="strength" checked> Tie weight</label><label><input name="sizeBy" type="radio" value="documents"> Documents</label><label><input name="sizeBy" type="radio" value="neighbors"> Neighbors</label><label><input name="sizeBy" type="radio" value="betweenness"> Betweenness</label></fieldset>
        <label class="find-label"><strong>Find person</strong><input id="findPerson" type="search" list="personNames" placeholder="Search a correspondent"><datalist id="personNames"></datalist></label>
        <label class="find-label"><strong>Find annotated tie</strong><input id="findClassTie" type="search" list="classTieNames" placeholder="Search a pair"><datalist id="classTieNames"></datalist></label>
        <div class="graph-stats" id="graphMetrics"></div>
      </aside>
      <div><div class="card stage" id="graphStage"><canvas id="networkCanvas" tabindex="0" aria-label="Interactive network of correspondents. Drag to pan, scroll to zoom, click a node or tie for details."></canvas><div class="tip hidden" id="graphTip"></div><div class="stage-bar"><button class="btn" id="resetGraph">Reset view</button><button class="btn" id="clearGraph">Clear selection</button></div></div><p class="graph-foot">The drawing shows the archive's largest connected network above its display threshold, plus all people in the class letters. Drag to pan · scroll to zoom.</p></div>
      <aside class="card body detail" id="graphDetail"></aside>
    </div>
  </section>
</div>
<script src="classroom_data.js"></script><script src="sample_data.js"></script><script src="data.js"></script><script src="overlay_positions.js"></script><script src="network_canvas.js"></script><script src="classroom.js"></script>
</html>
