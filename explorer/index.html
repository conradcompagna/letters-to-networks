<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Letters to Networks · classroom lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f2eb;--paper:#fffefa;--ink:#222a2a;--muted:#617070;--line:#d9ded9;--blue:#245d73;--pale:#e8f0ef;--orange:#c75d36;--light:#f8faf8;font:15px/1.5 "DM Sans",system-ui,sans-serif;color:var(--ink)}*{box-sizing:border-box}body{margin:0;background:var(--bg)}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}a{color:var(--blue)}h1,h2,h3,p{margin-top:0}h1,h2{font-family:"Newsreader",Georgia,serif}h1{font-size:clamp(2rem,4vw,3rem);line-height:1.03;margin:0}h2{font-size:1.7rem;line-height:1.15;margin-bottom:.45rem}h3{font-size:1.04rem;margin-bottom:.4rem}small,.muted{color:var(--muted)}.wrap{max-width:1560px;margin:auto;padding:22px clamp(14px,3vw,38px) 72px}.top{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:18px}.eyebrow{color:var(--orange);letter-spacing:.13em;text-transform:uppercase;font-weight:700;font-size:.71rem;margin-bottom:5px}.badge{background:var(--pale);padding:7px 11px;border-radius:100px;color:var(--blue);font-weight:700;font-size:.8rem;white-space:nowrap}.setup{display:flex;align-items:end;gap:12px;flex-wrap:wrap;padding:15px 18px;margin-bottom:14px}.setup label{display:grid;gap:4px;font-size:.79rem;font-weight:700}.setup input,.setup select{min-width:150px}.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;box-shadow:0 2px 12px #20352a08}.body{padding:18px}.btn{border:1px solid var(--line);border-radius:7px;padding:8px 12px;background:white;color:var(--ink);font-weight:700}.btn:hover:not(:disabled){border-color:var(--blue);background:var(--pale)}.btn.primary{background:var(--blue);border-color:var(--blue);color:white}.btn.primary:hover:not(:disabled){background:#18495d}.btn.sample{background:#f7e7df;border-color:#edc5b5;color:#8c3f25}.status{font-size:.84rem;color:var(--muted);margin:0}.status.error{color:#b13d25}.layout{display:grid;grid-template-columns:240px minmax(0,1fr) minmax(300px,375px);gap:14px;align-items:start}.deck{position:sticky;top:12px}.deck-buttons{display:grid;gap:5px;margin-top:12px}.letter-tab{border:1px solid var(--line);border-radius:7px;background:white;text-align:left;padding:9px 10px;display:grid;grid-template-columns:28px 1fr auto;gap:7px;align-items:start;color:var(--ink);font-size:.8rem}.letter-tab:hover,.letter-tab.active{background:var(--pale);border-color:var(--blue)}.letter-tab span:first-child{font-weight:700;color:var(--blue)}.letter-tab em{font-style:normal;color:var(--muted)}.reading{min-height:500px}.letter-head{display:flex;gap:12px;justify-content:space-between;align-items:start}.letter-head a{white-space:nowrap;font-size:.78rem}.letter-text{max-height:570px;overflow:auto;border-top:1px solid var(--line);margin-top:15px;padding-top:16px;font:1.08rem/1.62 "Newsreader",Georgia,serif}.letter-text p{margin:0 0 1em}.fields{display:grid;gap:11px}.fields label{display:grid;gap:4px;font-size:.8rem;font-weight:700}.fields select,.fields input,.fields textarea,.setup input,.setup select,.analysis textarea{width:100%;border:1px solid var(--line);background:#fff;border-radius:6px;padding:8px 10px;color:var(--ink)}.fields textarea{min-height:80px;resize:vertical}.fields .note-field{min-height:110px}.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.annotation-list{display:grid;gap:8px;margin:12px 0}.annotation{padding:10px;border:1px solid var(--line);border-radius:7px;background:var(--light);font-size:.78rem}.annotation strong{display:block}.annotation blockquote{margin:7px 0;color:var(--muted);font-style:italic}.annotation button{border:0;color:#ae4227;background:none;padding:0;font-weight:700}.annotation-actions{display:flex;gap:8px;flex-wrap:wrap}.graph-area{margin-top:16px}.graph-head{display:flex;align-items:end;justify-content:space-between;gap:12px;flex-wrap:wrap}.graph-controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:.83rem}.graph-controls label{display:flex;align-items:center;gap:5px}.graph-controls select,.graph-controls input{accent-color:var(--blue)}.graph-layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px;margin-top:14px}.graph-box{min-width:0}.graph-svg{width:100%;height:auto;display:block;background:#fcfdfb;border-radius:8px;border:1px solid var(--line)}.edge-base{stroke:#a6b5b4;stroke-opacity:.4}.edge-anno{stroke:var(--orange);stroke-opacity:.82}.edge-hit{stroke:transparent;stroke-width:13;cursor:pointer}.node{cursor:pointer}.node circle{fill:#fff;stroke:var(--blue);stroke-width:2.1}.node.active circle{fill:#f8d0bb;stroke:var(--orange);stroke-width:3}.node text{fill:var(--ink);font:11px "DM Sans",sans-serif;pointer-events:none;paint-order:stroke;stroke:#fcfdfb;stroke-width:3px}.node:hover circle{fill:var(--pale)}.graph-metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}.metric{padding:9px;background:var(--pale);border-radius:7px}.metric b{display:block;font-size:1.3rem;line-height:1.15}.metric small{font-size:.7rem}.detail{max-height:590px;overflow:auto}.detail blockquote{font-size:.8rem;border-left:3px solid var(--orange);padding-left:10px;margin:8px 0;color:var(--muted)}.detail-entry{border-top:1px solid var(--line);padding:10px 0;font-size:.8rem}.detail-entry p{margin:4px 0}.leader-table{width:100%;border-collapse:collapse;font-size:.78rem}.leader-table td,.leader-table th{border-bottom:1px solid var(--line);padding:5px;text-align:left}.leader-table th{color:var(--muted)}.leader-table button{border:0;background:none;color:var(--blue);padding:0;text-align:left}.analysis{margin-top:16px}.analysis textarea{min-height:280px;resize:vertical}.analysis-actions{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.info{background:#f5f8f6;border-left:3px solid var(--blue);padding:8px 11px;border-radius:3px;font-size:.83rem}.hidden{display:none!important}@media(max-width:1200px){.layout{grid-template-columns:230px minmax(0,1fr)}.annotation-panel{grid-column:2}}@media(max-width:800px){.layout,.graph-layout{grid-template-columns:1fr}.deck{position:static}.annotation-panel{grid-column:auto}.graph-svg{min-height:350px}.top{align-items:start}}:focus-visible{outline:3px solid #70a7b2;outline-offset:2px}
</style>
<div class="wrap">
  <header class="top">
    <h1>Letters to Networks</h1>
    <button class="btn" id="skipToGraph">Skip exercise · reveal graph</button>
  </header>
  <p class="status" id="modeStatus" role="status"></p>
  <div class="layout hidden" id="assignmentArea">
    <aside class="card body deck">
      <h2>Ten letters</h2>
      <p class="status" id="progress">0 / 10 annotated</p>
      <div class="deck-buttons" id="letterDeck"></div>
    </aside>
    <article class="card body reading"><div id="reader"></div></article>
    <section class="card body annotation-panel" id="annotationPanel">
      <h2>Annotate this letter</h2>
      <div class="fields">
        <div class="two"><label>From<select id="sourcePerson"></select></label><label>To<select id="targetPerson"></select></label></div>
        <label>Relationship<select id="relationType"><option value="">Choose relationship</option><option value="reports">Reports to</option><option value="requests">Requests from</option><option value="supports">Supports</option><option value="opposes">Opposes</option><option value="delegates">Delegates to</option><option value="introduces">Introduces to</option><option value="consults">Consults with</option><option value="negotiates">Negotiates with</option><option value="other">Other</option></select></label>
        <label>Evidence from the letter<textarea id="evidence" placeholder="Select a passage in the letter, then use the button below."></textarea></label>
        <button class="btn" id="useSelection">Use selected text</button>
        <label>What does the letter show?<textarea id="relationNote" placeholder="Explain the tie, or explain why you found none."></textarea></label>
        <button class="btn primary" id="addAnnotation">Add relationship</button>
        <div id="annotationList" class="annotation-list"></div>
        <button class="btn" id="noTie">No supported relationship in this letter</button>
        <p class="status" id="saveStatus" role="status"></p>
      </div>
    </section>
  </div>
  <section class="card body graph-area hidden" id="graphArea">
    <div class="graph-head">
      <div><h2>Class network</h2><p class="status" id="graphStatus"></p></div>
      <div class="graph-controls" id="graphControls">
        <label><input type="checkbox" id="showBase" checked> Letters</label>
        <label><input type="checkbox" id="showAnnotations" checked> Relationships</label>
        <label>Type <select id="typeFilter"><option value="all">All</option><option value="reports">Reports</option><option value="requests">Requests</option><option value="supports">Supports</option><option value="opposes">Opposes</option><option value="delegates">Delegates</option><option value="introduces">Introduces</option><option value="consults">Consults</option><option value="negotiates">Negotiates</option><option value="other">Other</option></select></label>
        <label>Find <select id="findPerson"><option value="">Person</option></select></label>
      </div>
    </div>
    <div class="graph-metrics" id="graphMetrics"></div>
    <div class="graph-layout">
      <div class="graph-box"><svg id="networkSvg" class="graph-svg" viewBox="0 0 1000 610" role="img" aria-label="Interactive graph of 300 letters and annotated relationships"></svg><p class="status">Gray: archival correspondence · orange: annotated relationships. Select a person or tie to see its sources.</p></div>
      <aside class="card body detail" id="graphDetail"><h3>Choose a person or tie</h3></aside>
    </div>
    <h3 style="margin-top:18px">Most connected people</h3><div id="leaderTable"></div>
  </section>
</div>
<script src="classroom_data.js"></script><script src="sample_data.js"></script><script src="classroom.js"></script>
</html>
